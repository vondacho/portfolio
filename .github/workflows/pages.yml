name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fails the run if a publication has missing or invalid metadata.
      - name: Build catalogue.json
        run: node scripts/build-catalogue.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html article.html catalogue.json _site/
          cp -R css js content _site/
          rm -rf _site/content/_legacy
          # Belt and braces: keep Pages from ever running Jekyll over the
          # published tree, which would swallow the front-mattered .md sources.
          touch _site/.nojekyll
          find _site -name '.DS_Store' -delete

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
